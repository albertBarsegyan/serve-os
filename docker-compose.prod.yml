services:
  app:
    container_name: serve_os_frontend_prod
    networks:
      - shared

    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}

    image: ghcr.io/albertbarsegyan/serve-os:latest

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      API_BASE_URL: ${API_BASE_URL}

    ports:
      - "3000:3000"

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    restart: unless-stopped

networks:
  shared:
    driver: bridge
    name: shared
