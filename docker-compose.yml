services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000/api}
        API_BASE_URL: ${API_BASE_URL:-http://localhost:4000/api}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      API_BASE_URL: ${API_BASE_URL:-http://localhost:4000/api}

    ports:
      - "3000:3000"
    restart: unless-stopped

