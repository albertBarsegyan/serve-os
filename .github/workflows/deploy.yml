name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/albertbarsegyan/serve-os

jobs:
  # ──────────────────────────────────────────────
  # Gate: lint + tests must pass before we build
  # ──────────────────────────────────────────────
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Biome check
        run: pnpm check
      - name: Unit tests
        run: pnpm test

  # ──────────────────────────────────────────────
  # Build image → push to GHCR → SSH deploy
  # ──────────────────────────────────────────────
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    needs: ci
    environment: production
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # VITE_API_BASE_URL is a public URL baked into the client bundle at
          # build time — stored as a repo Variable (not a Secret).
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_GTAG_ID=${{ secrets.VITE_GTAG_ID }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write .env
        run: |
          {
            echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}"
            echo "API_BASE_URL=${{ secrets.API_BASE_URL }}"
            echo "VITE_GTAG_ID=${{ secrets.VITE_GTAG_ID }}"
            echo "VITE_SITE_URL=${{ secrets.VITE_SITE_URL }}"
            echo "SITE_URL=${{ secrets.SITE_URL }}"
            echo "VITE_WEB3FORMS_ACCESS_KEY=${{ secrets.VITE_WEB3FORMS_ACCESS_KEY }}"
            echo "VITE_WEB3FORMS_ENDPOINT=${{ secrets.VITE_WEB3FORMS_ENDPOINT }}"
            echo "APP_IMAGE_TAG=${{ github.sha }}"
          } > .env

      - name: Install WireGuard
        run: sudo apt-get update && sudo apt-get install -y wireguard-tools

      - name: Connect to VPS tunnel
        env:
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: |
          printf '%s\n' "$WG_CONFIG" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

      - name: Copy files to server
        uses: appleboy/scp-action@v1
        with:
          host: 10.8.0.1
          port: 22
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          source: "docker-compose.prod.yml,.env"
          target: /opt/serve-os/

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: 10.8.0.1
          port: 22
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          # GHCR_TOKEN is forwarded as an env var to the remote script so it
          # never appears in plain text in the workflow logs.
          envs: GHCR_TOKEN
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u albertbarsegyan --password-stdin
            cd /opt/serve-os
            chmod 600 .env
            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env up -d
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

      - name: Disconnect tunnel
        if: always()
        run: sudo wg-quick down wg0 || true
