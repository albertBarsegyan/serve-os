<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ServeOS — You're offline</title>
    <style>
      :root {
        --brand: #3f8218;
        --brand-light: #6ab50c;
        --bg: #f5f9f2;
        --text: #1a2e14;
        --text-muted: #4a6b3a;
        --card-bg: #ffffff;
        --radius: 1rem;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          Manrope,
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        text-align: center;
      }

      .card {
        background: var(--card-bg);
        border: 1px solid color-mix(in srgb, var(--brand) 15%, transparent);
        border-radius: var(--radius);
        padding: 2.5rem 2rem;
        max-width: 28rem;
        width: 100%;
        box-shadow: 0 4px 24px color-mix(in srgb, var(--brand) 8%, transparent);
      }

      .icon {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.25rem;
        background: color-mix(in srgb, var(--brand) 12%, transparent);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .icon svg {
        width: 2rem;
        height: 2rem;
        stroke: var(--brand);
      }

      h1 {
        font-size: 1.375rem;
        font-weight: 700;
        margin-bottom: 0.625rem;
        color: var(--text);
      }

      p {
        font-size: 0.9375rem;
        color: var(--text-muted);
        line-height: 1.6;
        margin-bottom: 1.75rem;
      }

      button {
        background: var(--brand);
        color: #fff;
        border: none;
        border-radius: 0.5rem;
        padding: 0.65rem 1.5rem;
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: background 0.15s;
      }

      button:hover {
        background: var(--brand-light);
      }

      .wordmark {
        margin-top: 2rem;
        font-size: 0.8125rem;
        color: var(--text-muted);
        opacity: 0.7;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <!-- wifi-off icon (inline SVG, no external deps) -->
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="No connection">
          <line x1="2" y1="2" x2="22" y2="22" />
          <path d="M8.5 16.5a5 5 0 0 1 7 0" />
          <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
          <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
          <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" />
          <path d="M5 12.85A10 10 0 0 1 12 10" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>

      <h1>You're offline</h1>
      <p>
        No internet connection detected. Check your network settings and try again — ServeOS will reconnect automatically.
      </p>

      <button type="button" onclick="window.location.reload()">Try again</button>
    </div>

    <p class="wordmark">ServeOS</p>
  </body>
</html>
